<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>钦原 · 控制台</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">钦</div>
      <div class="brand-text">
        <strong>钦原</strong>
        <span>授权安全测试</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-group">
        <div class="nav-label">总览</div>
        <a class="nav-item" href="#/dashboard" data-match="#/dashboard">
          <span class="nav-icon">◫</span><span>仪表盘</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-label">工作区</div>
        <a class="nav-item" href="#/runs" data-match="#/runs">
          <span class="nav-icon">≡</span><span>任务</span><span class="nav-badge" id="badge-runs"></span>
        </a>
        <a class="nav-item" href="#/findings" data-match="#/findings">
          <span class="nav-icon">◈</span><span>发现</span><span class="nav-badge" id="badge-findings"></span>
        </a>
        <a class="nav-item" href="#/assets" data-match="#/assets">
          <span class="nav-icon">◇</span><span>资产</span><span class="nav-badge" id="badge-assets"></span>
        </a>
        <a class="nav-item" href="#/campaigns" data-match="#/campaigns">
          <span class="nav-icon">⛬</span><span>战役</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-label">系统</div>
        <a class="nav-item" href="#/approvals" data-match="#/approvals">
          <span class="nav-icon">⚖</span><span>审批</span><span class="nav-badge" id="badge-approvals"></span>
        </a>
        <a class="nav-item" href="#/ops" data-match="#/ops">
          <span class="nav-icon">⛭</span><span>运维</span>
        </a>
        <a class="nav-item" href="#/settings" data-match="#/settings">
          <span class="nav-icon">⚙</span><span>设置</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-foot">
      <span id="health-dot" class="dot"></span>
      <span id="health-text">连接中…</span>
    </div>
  </aside>

  <header class="topbar">
    <div class="crumb">
      <h1 id="page-title">仪表盘</h1>
      <span id="page-sub" class="crumb-sub"></span>
    </div>
    <div class="topbar-actions">
      <span id="engine-chip" class="chip chip-quiet" title="模型与引擎">—</span>
      <button class="btn btn-ghost" id="btn-theme" type="button" title="切换主题">◐</button>
      <button class="btn" id="btn-refresh" type="button">刷新</button>
    </div>
  </header>

  <main class="view" id="view"></main>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <strong id="drawer-title">详情</strong>
    <button class="btn btn-ghost" id="drawer-close" type="button">关闭</button>
  </div>
  <pre id="drawer-body" class="drawer-body"></pre>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/graph.js"></script>
<script src="/app.js"></script>
</body>
</html>
